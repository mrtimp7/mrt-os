name: MRT OS ISO Derleyici

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: GHCR Konteyner Deposuna Giriş Yap
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: MRT OS İmajını İnşa Et ve Gönder
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mrt-os:latest"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          
          podman build -t "$IMAGE_LOWER" .
          podman push "$IMAGE_LOWER"

      - name: Hızlı MRT OS ISO İmajını Üret (Bazzite/uBlue Motoru)
        uses: jasonn3/build-container-installer@main
        id: build
        with:
          arch: x86_64
          image_name: mrt-os
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: latest
          version: 41
          variant: Kinoite
          iso_name: MRT-OS-KDE.iso

      - name: ISO'yu İndirilebilir Hale Getir (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MRT OS v1.0.0 (KDE Live)"
          body: "Bulutta otomatik olarak oluşturulmuş MRT OS KDE Kurulum ISO'su."
          files: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
