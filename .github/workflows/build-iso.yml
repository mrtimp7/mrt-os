name: MRT OS Canli Masaustu (Live ISO) Derleyici

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-live-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Derleme Betigini (build.sh) Hazirla
        run: |
          cat << 'SCRIPT' > build.sh
          #!/bin/bash
          set -e

          # 1. Gerekli araçları yükle
          dnf install -y livecd-tools pykickstart git lorax-lmc-novirt

          # 2. Şablonu indir ve birleştir
          git clone https://pagure.io/fedora-kickstarts.git -b f41
          cd fedora-kickstarts
          ksflatten -c fedora-live-kde.ks -o mrt-live.ks

          # 3. Sanal disk boyutunu 18 GB'a genişlet
          sed -i '/^part \//d' mrt-live.ks
          sed -i '/^clearpart/a part / --size=18000 --fstype=ext4' mrt-live.ks

          # 4. Paketleri ekle
          sed -i 's/^%packages.*/%packages --ignoremissing/' mrt-live.ks
          sed -i '/^%packages/a dracut-live\nwine\nwine-core\nwine-common\nwinetricks\ncabextract\ngnome-software\nflatpak' mrt-live.ks
          sed -i '/kde-spin-initial-setup/d' mrt-live.ks

          # 5. MRT OS v1.0.1 Yapılandırmasını Ekle
          cat << 'EOF' >> mrt-live.ks

          %post
          sed -i 's/^NAME=.*/NAME="MRT OS"/' /etc/os-release
          sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="MRT OS v1.0.1 (KDE Live Edition)"/' /etc/os-release
          sed -i 's/^VERSION=.*/VERSION="1.0.1"/' /etc/os-release
          sed -i 's/^VERSION_ID=.*/VERSION_ID="1.0.1"/' /etc/os-release
          sed -i 's/^ID=.*/ID=mrtos/' /etc/os-release
          sed -i 's/^ID_LIKE=.*/ID_LIKE="fedora"/' /etc/os-release

          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          mkdir -p /usr/share/applications /etc/xdg
          cat << 'APP' > /usr/share/applications/wine-runner.desktop
          [Desktop Entry]
          Type=Application
          Name=Wine Windows Program Loader
          Comment=Windows uygulamalarını (.exe) çalıştırır
          Exec=wine %f
          MimeType=application/x-ms-dos-executable;application/x-msi;application/x-msdownload;application/x-dosexec;
          Icon=wine
          NoDisplay=false
          StartupNotify=true
          Terminal=false
          Categories=Utility;System;
          APP

          cat << 'MIME' >> /etc/xdg/mimeapps.list
          [Default Applications]
          application/x-ms-dos-executable=wine-runner.desktop
          application/x-msi=wine-runner.desktop
          application/x-msdownload=wine-runner.desktop
          application/x-dosexec=wine-runner.desktop

          [Added Associations]
          application/x-ms-dos-executable=wine-runner.desktop;
          application/x-msi=wine-runner.desktop;
          application/x-msdownload=wine-runner.desktop;
          application/x-dosexec=wine-runner.desktop;
          MIME

          update-desktop-database /usr/share/applications/
          %end
          EOF

          # 6. Canlı Masaüstü ISO'sunu Üret
          echo "livecd-creator ile MRT-OS-v1.0.1.iso inşa ediliyor..."
          livecd-creator --config=mrt-live.ks --fslabel=MRT-OS-v1.0.1 --cache=/var/cache/live

          mv MRT-OS-v1.0.1.iso /work/MRT-OS-v1.0.1.iso
          SCRIPT

          chmod +x build.sh

      - name: Canlı Masaüstü ISO'sunu Bulutta Derle (Fedora Container)
        run: |
          docker run --rm --privileged -v $(pwd):/work -w /work fedora:41 /work/build.sh

      - name: Üretilen ISO Boyutunu Kontrol Et
        run: |
          ls -lh MRT-OS-v1.0.1.iso

      - name: Canlı ISO'yu GitHub Releases Olarak Yayınla (Eski Sürümleri Temizle)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: MRT OS v1.0.1 - Live KDE ISO
          body: |
            ## MRT OS v1.0.1 - Fedora 44 Tabanlı KDE Live ISO
            
            ### ✨ Özellikler
            - 🐧 **Fedora 44** tabanlı modern KDE Plasma masaüstü
            - 🍷 **Wine & Winetricks** önceden yüklü (Windows uygulama desteği)
            - 📦 **Flatpak & Flathub** entegrasyonu
            - 🖱️ **.EXE dosyalarını çift tıklayarak çalıştırma** desteği
            - 🎨 Özelleştirilmiş "MRT OS" marka kimliği
            
            ### 📥 Kurulum
            1. ISO dosyasını indirin
            2. USB belleğe yazdırın (Rufus, BalenaEtcher veya dd kullanabilirsiniz)
            3. Bilgisayarınızı USB'den başlatın
            4. Canlı sistem olarak deneyin veya diske kurun
            
            ### 🔧 Teknik Detaylar
            - **Taban:** Universal Blue Kinoite (Fedora 44)
            - **Masaüstü:** KDE Plasma
            - **Boyut:** ~3 GB
            - **Sürüm:** 1.0.1
            
            > ⚠️ **Not:** Bu bir canlı (live) ISO'dur. Sistem gereksinimlerini karşıladığınızdan emin olun.
          files: |
            MRT-OS-v1.0.1.iso
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Eski Release Sürümlerini Temizle
        run: |
          echo "Eski sürümler temizleniyor, sadece en son sürüm (v1.0.1) kalacak..."
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release delete v1.0.0-beta --yes --cleanup-tag || true
          gh release delete v0.9.9 --yes --cleanup-tag || true
          gh release delete test-release --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
