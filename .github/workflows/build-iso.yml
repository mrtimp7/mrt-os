name: MRT OS ISO Derleyici

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: GHCR Konteyner Deposuna Giriş Yap
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: MRT OS İmajını İnşa Et ve Gönder
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mrt-os:latest"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          
          # Root deposuna inşa et ki ISO üretici doğrudan erişebilsin
          sudo podman build -t "$IMAGE_LOWER" .
          sudo podman push "$IMAGE_LOWER"

      - name: Kurulabilir ISO İmajını Üret (bootc)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mrt-os:latest"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          mkdir -p output
          sudo podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            "$IMAGE_LOWER"

          # Oluşan ISO'nun izinlerini GitHub Release için aç
          sudo chmod -R 777 output

      - name: ISO'yu İndirilebilir Hale Getir (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MRT OS v1.0.0 (KDE Live)"
          body: "Bulutta otomatik olarak oluşturulmuş MRT OS KDE Kurulum ISO'su."
          files: output/bootiso/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
