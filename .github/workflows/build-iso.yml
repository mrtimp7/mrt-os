name: MRT OS ISO Derleyici

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: GHCR Konteyner Deposuna Giriş Yap
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: MRT OS İmajını İnşa Et ve Gönder
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mrt-os:latest"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          
          podman build -t "$IMAGE_LOWER" .
          podman push "$IMAGE_LOWER"

      - name: MRT OS Kurulum ISO'sunu Üret (mkksiso)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mrt-os:latest"
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          echo "1. Resmi Fedora Kinoite ISO indiriliyor..."
          curl -Lo kinoite-base.iso https://download.fedoraproject.org/pub/fedora/linux/releases/41/Kinoite/x86_64/iso/Fedora-Kinoite-ostree-x86_64-41-1.4.iso

          echo "2. Kickstart dosyası oluşturuluyor..."
          cat << EOF > mrt-installer.ks
          ostreecontainer --url=${IMAGE_LOWER} --no-signature-verification
          EOF

          echo "3. mkksiso ile MRT-OS-KDE.iso hazırlanıyor..."
          docker run --rm -v $(pwd):/work -w /work fedora:41 bash -c "dnf install -y lorax && mkksiso --ks mrt-installer.ks kinoite-base.iso MRT-OS-KDE.iso"

      - name: ISO'yu İndirilebilir Hale Getir (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MRT OS v1.0.0 (KDE Live)"
          body: "Bulutta otomatik olarak oluşturulmuş MRT OS KDE Kurulum ISO'su."
          files: MRT-OS-KDE.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
