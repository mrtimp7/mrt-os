name: MRT OS ISO Derleyici

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Konteynere Giriş Yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: MRT OS İmajını İnşa Et
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/mrt-os:latest .
          docker push ghcr.io/${{ github.repository_owner }}/mrt-os:latest

      - name: Kurulabilir ISO İmajını Üret (bootc)
        run: |
          mkdir -p output
          docker run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            ghcr.io/${{ github.repository_owner }}/mrt-os:latest

      - name: ISO'yu İndirilebilir Hale Getir (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MRT OS v1.0.0"
          body: "Otomatik olarak oluşturulmuş MRT OS KDE Live Kurulum ISO'su."
          files: output/bootiso/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
